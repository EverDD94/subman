name: Imagen Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/subman
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba rápida de la imagen (ffmpeg + detector de voz + sincronización)
        run: |
          IMG='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          docker pull "$IMG"
          mkdir -p prueba
          printf '1\n00:00:01,000 --> 00:00:03,000\nHola\n\n2\n00:00:05,000 --> 00:00:07,000\nAdiós\n' > prueba/x.srt
          docker run --rm -v "$PWD/prueba:/p" --entrypoint ffmpeg "$IMG" -v error -f lavfi -i "sine=f=440:d=10" /p/x.mkv
          set +e
          docker run --rm -v "$PWD/prueba:/p" "$IMG" sync /p/x.mkv /p/x.srt -o /p/out.srt
          code=$?
          set -e
          # 0 = ok, 2 = no verificado (normal con un tono); cualquier otro código es un error real
          [ "$code" = 0 ] || [ "$code" = 2 ]
          test -s prueba/out.srt
