name: App TV (Android)

on:
  push:
    branches: [main]
    paths: ["tv-android/**", ".github/workflows/tv-android.yml"]
  pull_request:
    paths: ["tv-android/**", ".github/workflows/tv-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: ./gradlew assembleDebug
      - name: Reunir APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/videotecario-tv.apk \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: videotecario-tv
          path: tv-android/out/videotecario-tv.apk
      # En main se publica siempre en la misma dirección para instalarla con Downloader:
      # https://github.com/everdd94/subman/releases/download/tv/videotecario-tv.apk
      - name: Publicar en la release "tv"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tv >/dev/null 2>&1 || gh release create tv --title "App de TV" --notes "APK para Google TV y Fire TV" --prerelease
          gh release upload tv out/videotecario-tv.apk --clobber
