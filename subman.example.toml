# Copiar a /config/subman.toml (en el Synology: la carpeta que montes como /config)

# Carpetas de la biblioteca, tal como se ven DENTRO del contenedor
library = ["/media/Series", "/media/Peliculas"]
languages = ["es"]
database = "/config/subman.db"

candidates = 5          # máximo de subtítulos a probar por episodio (cada uno gasta una descarga)
keep_review = true      # guardar también los que salen "revisar" (dudosos), marcados en la base de datos
sync_existing = true    # probar primero los subtítulos que ya tengas junto a los videos
archive_languages = ["en"]  # subtítulos en estos idiomas se apartan a /config/archivo/<idioma>
# Los subtítulos que fallan o sobran se mueven a /config/papelera (misma estructura de carpetas).
dry_run = false         # true = sólo dice en el registro qué haría, sin mover ni descargar nada
reference = "auto"      # auto | audio | embedded

[providers.opensubtitles]
api_key = ""            # https://www.opensubtitles.com/consumers
username = ""
password = ""
