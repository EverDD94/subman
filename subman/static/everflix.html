<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Everflix</title>
<link rel="icon" href="/everflix/logo-e.png">
<link rel="apple-touch-icon" href="/everflix/logo-e.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
/* Everflix en el navegador: el mismo aspecto que la app de la tele (Roku y Google TV). */
:root{
  --bg:#0b0d12;--card:#161a22;--card-2:#1e2330;--ink:#f4f2ee;--muted:#9aa0ad;--accent:#3d63e0;--soft:#9db4ff;
  --ok:#2e9e5b;--warn:#c99a2e;--bad:#c25555;--glass:rgba(255,255,255,.1);--glass-on:rgba(255,255,255,.2);
  --rail:76px;--font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- intro y entrar ---- */
#intro{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;cursor:pointer}
#intro video{width:100%;height:100%;object-fit:contain}
.pl-skip{position:absolute;right:28px;bottom:120px;z-index:5;font-size:16px;padding:12px 20px}
#intro .skip{position:absolute;right:24px;bottom:24px;background:var(--glass);border:0;border-radius:999px;padding:10px 18px;color:#fff;font-weight:600;backdrop-filter:blur(10px)}
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% 0%,rgba(61,99,224,.35),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(157,180,255,.12),transparent 60%),var(--bg)}
#login form{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
#login .logo{width:220px;margin:0 auto 18px}
#login h1{font:800 26px/1.1 var(--font);margin:0;text-align:center}
#login p{color:var(--muted);text-align:center;margin:0 0 6px}
#login input{background:rgba(255,255,255,.07);border:2px solid transparent;border-radius:14px;padding:15px 16px;color:var(--ink);font:500 17px var(--font);outline:none}
#login input:focus{border-color:var(--accent)}
#login .err{color:#ff8f8f;min-height:22px;text-align:center;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;min-height:48px;padding:0 24px;font:700 16px var(--font);background:var(--glass);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s,background .15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--glass-on)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:#0b0d12}
.btn.pri:hover{background:#fff}
.btn.blue{background:var(--accent);color:#fff}

/* ---- menú lateral (como la tele) ---- */
#rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:30;display:flex;flex-direction:column;gap:4px;padding:22px 12px;
  background:linear-gradient(90deg,rgba(11,13,18,.95),rgba(11,13,18,.0));transition:width .22s ease,background .22s}
#rail:hover,#rail:focus-within{width:250px;background:#000}
#rail .brand{height:52px;display:flex;align-items:center;padding-left:6px;margin-bottom:18px;overflow:hidden}
#rail .brand .e{width:38px;flex:none}
#rail .brand .full{height:34px;margin-left:-2px;display:none}
#rail:hover .brand .e,#rail:focus-within .brand .e{display:none}
#rail:hover .brand .full,#rail:focus-within .brand .full{display:block}
#rail a{display:flex;align-items:center;gap:16px;height:44px;padding:0 14px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden}
#rail a span{opacity:0;transition:opacity .15s}
#rail:hover a span,#rail:focus-within a span{opacity:1}
#rail a:hover{color:var(--ink)}
#rail a.on{color:var(--ink)}
#rail:hover a.on,#rail:focus-within a.on{background:var(--ink);color:#0b0d12}
#rail hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:8px 6px;width:auto}
#rail .grow{flex:1}
#rail .av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--card-2)}
main{margin-left:var(--rail);min-height:100vh;position:relative}

/* ---- destacado (hero) y fondos ---- */
.stage{position:fixed;inset:0;z-index:-1;background:var(--bg)}
.stage i{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:0;transition:opacity .6s ease}
.stage i.on{opacity:1}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,18,.97) 0%,rgba(11,13,18,.82) 32%,rgba(11,13,18,.25) 70%,rgba(11,13,18,.35) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(11,13,18,.6) 38%,transparent 70%)}
.hero{min-height:min(64vh,640px);display:flex;flex-direction:column;justify-content:flex-end;padding:90px 56px 26px;max-width:900px}
.kicker{display:flex;align-items:center;gap:10px;font:700 13px var(--font);letter-spacing:.06em;text-transform:uppercase;color:#d6dae3}
.tag{background:var(--accent);color:#fff;border-radius:6px;padding:3px 8px;font-size:12px}
.hero h1,.det h1{font:900 clamp(38px,5.4vw,76px)/.95 var(--font);text-transform:uppercase;letter-spacing:-.01em;margin:12px 0 10px;text-wrap:balance}
.logoimg{max-width:min(520px,80%);max-height:170px;object-fit:contain;object-position:left bottom;margin:16px 0 14px}
.epline{color:var(--soft);font-weight:700;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.epline .left{color:#c8ccd6;font-weight:500}
.ov{color:#d6dae3;max-width:720px;margin:12px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

/* ---- filas ---- */
.rows{padding:0 0 60px}
.row{margin-top:26px}
.row h2{font:800 20px var(--font);margin:0 56px 12px;display:flex;align-items:baseline;gap:10px}
.row h2 small{color:var(--muted);font-weight:600;font-size:14px}
.strip{position:relative}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 56px 14px;scroll-padding:0 56px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.strip .nav{position:absolute;top:6px;bottom:14px;width:48px;border:0;background:rgba(11,13,18,.7);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .2s;z-index:2}
.strip:hover .nav{opacity:1}
.strip .nav.l{left:0;border-radius:0 12px 12px 0}
.strip .nav.r{right:0;border-radius:12px 0 0 12px}
.card{flex:none;width:clamp(220px,20vw,300px);scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;color:inherit}
.card .pic{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 0 0 0 var(--ink);transition:box-shadow .15s,transform .2s}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .pic .fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;font:800 20px/1.1 var(--font);background:linear-gradient(135deg,#25304f,#161a22)}
.card:hover .pic,.card:focus-visible .pic{box-shadow:0 0 0 3px var(--ink);transform:translateY(-2px)}
.card:focus-visible{outline:none}
.card .bar{position:absolute;left:10px;right:10px;bottom:9px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.card .seen{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(11,13,18,.7);display:grid;place-items:center}
.card .seen .i{width:15px;height:15px;stroke-width:3}
.card .badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font:700 12px var(--font)}
.card b{display:block;margin-top:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.poster{width:clamp(130px,11vw,180px)}
.card.poster .pic{aspect-ratio:2/3}
.card.person{width:130px}
.card.person .pic{aspect-ratio:1;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 16px;padding:0 56px}
.grid .card,.grid .card.poster{width:auto}

/* ---- páginas ---- */
.page{padding:70px 0 40px}
.page>h1,.page>.sub{margin-left:56px;margin-right:56px}
.page>h1{font:900 clamp(34px,4.4vw,56px)/1 var(--font);text-transform:uppercase;margin-top:0;margin-bottom:8px}
.page>.sub{color:var(--muted);margin-top:0;margin-bottom:22px;max-width:720px}
.empty{color:var(--muted);padding:30px 56px}
.loading{padding:120px 56px;color:var(--muted);display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ytplay{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center}
.ytplay video{width:100%;height:100%;background:#000}
.ytplay .btn{position:absolute;top:20px;right:20px}

.ytlink{margin:0 56px 24px;background:var(--card);border-radius:14px;padding:18px 22px;max-width:760px}
.ytlink ol{padding-left:20px;line-height:1.7}.ytlink code.big{font-size:20px;letter-spacing:2px}
.grid.yt{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ytapp{display:flex;min-height:100vh}
.ytside{width:230px;flex:none;padding:22px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.ytside nav button,.ytside #ytSubs button{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;color:var(--ink);padding:10px 14px;border-radius:10px;font:500 15px var(--font);cursor:pointer;text-align:left}
.ytside nav button:hover,.ytside #ytSubs button:hover{background:rgba(255,255,255,.08)}.ytside nav button.on{background:rgba(61,99,224,.25);font-weight:700}
.ytside hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:12px 6px}.ytside h4{margin:4px 14px 6px;font:700 15px var(--font)}
.ytside #ytSubs img,.ytside #ytSubs .av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none}
.ytside #ytSubs span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytlogo{display:flex;align-items:center;gap:8px;font:900 24px var(--font);letter-spacing:-.5px;padding:0 14px 18px}
.ytlogo span{background:var(--accent);border-radius:9px;width:40px;height:28px;display:grid;place-items:center}.ytlogo span .i{width:16px;height:16px;fill:#fff;stroke:none}
.ytmain{flex:1;min-width:0;padding:18px 32px 60px 12px}
.yttop{display:flex;gap:16px;align-items:center;justify-content:center;margin-bottom:16px;position:relative}
.ytsearch{flex:1;max-width:640px;position:relative}.ytsearch .i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ytsearch input{width:100%;background:rgba(255,255,255,.06);border:2px solid rgba(61,99,224,.5);border-radius:40px;padding:12px 20px 12px 52px;color:var(--ink);font:500 17px var(--font);outline:none}
.ytsearch input:focus{border-color:var(--accent);box-shadow:0 0 18px rgba(61,99,224,.45)}
.ytacct{position:absolute;right:0}.ytacct.on i{width:10px;height:10px;border-radius:50%;background:#2e9e5b;display:inline-block}
.ytlink{margin:0 0 18px;background:var(--card);border-radius:14px;padding:18px 22px;max-width:760px}.ytlink ol{padding-left:20px;line-height:1.7}.ytlink code.big{font-size:20px;letter-spacing:2px}
.ytchips{display:flex;gap:10px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}
.ytchips button{flex:none;background:rgba(255,255,255,.08);border:0;color:var(--ink);padding:8px 16px;border-radius:10px;font:600 14px var(--font);cursor:pointer}
.ytchips button.on{background:var(--ink);color:#0b0d12}
.ythero{display:flex;gap:26px;align-items:center;background:linear-gradient(135deg,rgba(61,99,224,.18),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin-bottom:26px}
.ythero .pic{width:min(46%,520px);flex:none}.ythero small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.ythero h2{font:800 26px/1.2 var(--font);margin:6px 0 12px}.ythero .c{display:flex;align-items:center;gap:10px}.ythero .acts{margin-top:18px}
.ytgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px 18px}
.ytv .pic,.ythero .pic,.ytpl .pic{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer}
.ytv .pic img,.ythero .pic img,.ytpl .pic img{width:100%;height:100%;object-fit:cover;transition:transform .25s}.ytv:hover .pic img{transform:scale(1.04)}
.ytv .pic i,.ythero .pic i,.ytpl .pic i{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font:700 12px var(--font);padding:2px 6px;border-radius:5px;font-style:normal}
.ytv .pic i.live{background:#d33}
.ytv .info{display:flex;gap:12px;margin-top:12px}.ytv .info>div{min-width:0}
.ytv .av,.ythero .av,.ytwch .av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:#2a3350;display:grid;place-items:center;font-weight:800}
.avb{background:none;border:0;padding:0;cursor:pointer;height:36px}
.ytv .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:none;border:0;padding:0;color:var(--ink);font:700 15px/1.35 var(--font);text-align:left;cursor:pointer}
.ytv .c,.ythero .c,.ytwch .c{background:none;border:0;padding:0;color:var(--muted);font:500 14px var(--font);cursor:pointer;display:block;margin-top:4px;text-align:left}
.ytv .c:hover,.ythero .c:hover,.ytwch .c:hover{color:var(--ink)}.ytv span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ytsec{display:flex;align-items:center;gap:10px;font:800 22px var(--font);margin:34px 0 16px}.ytsec .i{color:var(--accent)}
.ytshorts{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}.ytshorts.wrap{flex-wrap:wrap}
.yts{flex:none;width:180px;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer}
.yts img{width:180px;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:var(--card)}
.yts b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 14px var(--font);margin-top:8px}.yts span{color:var(--muted);font-size:13px}
.ytpl{background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer}.ytpl b{display:block;margin-top:10px;font:700 15px var(--font)}
.ytchans{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 16px}
.ytchan{background:none;border:0;color:var(--ink);cursor:pointer;text-align:center;font:600 14px var(--font)}
.ytchan img,.ytchan .noimg{width:110px;height:110px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;background:var(--card);transition:transform .15s}
.ytchan:hover img{transform:scale(1.06);box-shadow:0 0 0 3px var(--ink)}
.ytchead{margin-bottom:20px}.ytchead .ban{height:180px;border-radius:16px;background:center/cover;margin-bottom:20px}
.ytchead .who{display:flex;gap:22px;align-items:center;margin-bottom:16px}.ytchead .who img{width:110px;height:110px;border-radius:50%;object-fit:cover}
.ytchead h2{margin:0;font:800 32px var(--font)}.ytchead span{color:var(--muted)}.ytchead p{color:var(--muted);max-width:700px;margin:8px 0 0;font-size:14px}
.ytwatch{position:fixed;inset:0;z-index:80;background:var(--bg,#0b0d12);overflow:auto;padding:14px 28px 50px}
.ytwbar{display:flex;align-items:center;gap:20px;margin-bottom:14px}.ytwbar .ytlogo{padding:0}
.ytwgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:26px}
@media (max-width:1100px){.ytwgrid{grid-template-columns:1fr}.ytside{display:none}}
.ytplayer{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}.ytplayer video{width:100%;height:100%}
.ytplayer .spin{position:absolute;left:50%;top:50%;margin:-20px}.ytplayer .err{position:absolute;inset:0;display:grid;place-items:center;color:#fff;padding:20px;text-align:center}
.ytwatch h1{font:800 22px/1.3 var(--font);margin:16px 0 12px;text-transform:none}
.ytwch{display:flex;align-items:center;gap:12px}.ytwch .c{color:var(--ink);font-weight:700;font-size:16px;margin:0}.ytwch span{color:var(--muted);font-size:13px}.ytwch .grow{flex:1}
.ytdesc{margin-top:16px;background:rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;white-space:pre-wrap;font-size:14px;line-height:1.5;max-height:5.5em;overflow:hidden;cursor:pointer}
.ytdesc.open{max-height:none}
.ytwatch aside h4{margin:0 0 12px;font:800 17px var(--font)}
.ythero>.pic{width:min(46%,520px);flex:none}.ythero .c{display:flex!important;align-items:center;gap:10px}
.ytv.row{display:flex;gap:10px;margin-bottom:12px}.ytv.row .pic{width:168px;flex:none;border-radius:10px}.ytv.row .t{font-size:14px}
.search{margin:0 56px 26px;position:relative;max-width:760px}
.search input{width:100%;background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:16px;padding:18px 20px 18px 54px;color:var(--ink);font:600 20px var(--font);outline:none}
.search input:focus{border-color:var(--accent)}
.search .i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* ---- ficha ---- */
.det{padding:110px 56px 10px;max-width:980px}
.det .meta{display:flex;gap:12px;flex-wrap:wrap;color:#c8ccd6;font-weight:600;align-items:center}
.det .meta .dot{opacity:.5}
.det .ov{-webkit-line-clamp:5}
.tiles{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;align-items:flex-start}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:88px;padding:14px 12px 10px;border:0;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:600 13px var(--font);transition:background .15s,transform .15s;color:var(--ink)}
.tile:hover{background:var(--glass-on);transform:translateY(-2px)}
.tile.sel{background:rgba(61,99,224,.55)}
.tile.play{flex-direction:row;min-height:62px;padding:0 28px;font-size:17px;font-weight:800;background:var(--ink);color:#0b0d12;border-radius:999px;align-self:center}
.tile.play:hover{background:#fff}
.tile .i{width:24px;height:24px}
.hint{color:var(--muted);font-size:14px;min-height:21px;margin-top:10px}
.seasons{display:flex;gap:8px;flex-wrap:wrap;margin:26px 56px 0}
.pill{border:0;border-radius:999px;padding:8px 16px;background:var(--glass);font:700 14px var(--font);color:var(--ink)}
.pill.on{background:var(--accent);color:#fff}
.pill.ok{background:rgba(46,158,91,.25);color:#7ee2a6}
.pill.blue{background:rgba(61,99,224,.3);color:var(--soft)}
.pill.warn{background:rgba(201,154,46,.25);color:#f0cf7d}
.pill.bad{background:rgba(194,85,85,.25);color:#ff9d9d}
.ep .pic .num{position:absolute;left:10px;top:8px;font:800 13px var(--font);background:rgba(11,13,18,.7);border-radius:6px;padding:2px 7px}
.ep span.ovl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---- menús y avisos ---- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;animation:fade .15s}
.sheet .box{width:min(460px,100%);max-height:85vh;overflow:auto;background:#12151c;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheet .box.wide{width:min(760px,100%)}
.sheet h3{margin:0 0 6px;font:800 22px var(--font)}
.sheet .opt{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:0;border-radius:12px;background:none;text-align:left;font-weight:600}
.sheet .opt:hover{background:var(--glass)}
.sheet .opt.sel{color:var(--soft)}
.sheet .opt.sel::after{content:"✓";font-weight:800}
.sheet .head{color:var(--muted);font:700 12px var(--font);letter-spacing:.08em;margin:14px 14px 4px}
.sug{display:flex;gap:18px}
.sug img{width:140px;border-radius:12px;flex:none;align-self:flex-start}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:#0b0d12;border-radius:999px;padding:12px 22px;font-weight:700;z-index:90;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---- peticiones ---- */
.reqs{display:flex;flex-direction:column;gap:10px;padding:0 56px;max-width:980px}
.req{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:16px;padding:12px}
.req img,.req .noimg{width:62px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;background:var(--card-2);flex:none}
.req .t{flex:1;min-width:0}
.req .t b{display:block}
.req .t span{color:var(--muted);font-size:14px}
.req .a{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.req .btn{min-height:40px;padding:0 16px;font-size:14px}
.page h2.sec{font:800 22px var(--font);margin:30px 56px 14px}

/* ---- reproductor ---- */
#player{position:fixed;inset:0;z-index:80;background:#000;cursor:none}
#player.ui{cursor:default}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
#player video::cue{font-family:var(--font);font-weight:600;font-size:clamp(18px,2.6vw,36px);background:rgba(0,0,0,.55);color:#fff;line-height:1.3}
.pl-top,.pl-bot{position:absolute;left:0;right:0;padding:24px 34px;opacity:0;transition:opacity .25s;pointer-events:none}
#player.ui .pl-top,#player.ui .pl-bot{opacity:1;pointer-events:auto}
.pl-top{top:0;display:flex;gap:18px;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
.pl-top .t b{display:block;font:800 22px var(--font)}
.pl-top .t span{color:#c8ccd6}
.pl-bot{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);padding-top:70px}
.seek{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek .rail{position:absolute;left:0;right:0;height:5px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.seek .buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35)}
.seek .done{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.seek .knob{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.seek .tip{position:absolute;bottom:26px;transform:translateX(-50%);background:rgba(0,0,0,.8);border-radius:6px;padding:3px 8px;font:700 13px var(--font);display:none}
.seek:hover .tip{display:block}
.pl-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.pl-row .time{white-space:nowrap;font:600 15px var(--font);color:#d6dae3;margin:0 8px;font-variant-numeric:tabular-nums}
.pl-row .sp{flex:1}
.gb{display:inline-flex;align-items:center;gap:8px;height:46px;min-width:46px;justify-content:center;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:700 14px var(--font);color:#fff}
.gb:hover{background:rgba(255,255,255,.24)}
.gb.big{height:56px;min-width:56px}
.pl-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.pl-center .spin{width:54px;height:54px;border-width:4px}
.pl-flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);border-radius:999px;padding:14px 22px;font:800 20px var(--font);opacity:0;transition:opacity .3s}
.pl-flash.show{opacity:1;transition:none}
.pl-panel{text-align:left;position:absolute;right:30px;bottom:110px;width:min(340px,calc(100% - 40px));max-height:60vh;overflow:auto;background:rgba(18,21,28,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;padding:10px}
.pl-next{position:absolute;right:34px;bottom:120px;display:flex;gap:16px;align-items:center;background:rgba(18,21,28,.9);backdrop-filter:blur(20px);border-radius:18px;padding:14px;max-width:min(520px,calc(100% - 40px))}
.pl-next img{width:170px;aspect-ratio:16/9;object-fit:cover;border-radius:10px}
.pl-next .t span{color:var(--muted);font-size:13px;display:block}
.pl-rate{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.7)}
.pl-rate .box{text-align:center}
.pl-rate h3{font:800 28px var(--font);margin:0 0 18px}

/* ---- móvil: el menú abajo ---- */
@media (max-width:760px){
  :root{--rail:0px}
  #rail{top:auto;left:0;right:0;width:auto!important;height:calc(64px + env(safe-area-inset-bottom));flex-direction:row;padding:6px 8px env(safe-area-inset-bottom);background:rgba(8,10,14,.96)!important;justify-content:space-around;gap:0;backdrop-filter:blur(16px)}
  #rail .brand,#rail hr,#rail .grow,#rail .lib{display:none}
  #rail a{flex-direction:column;gap:3px;height:52px;padding:4px 6px;font-size:11px;justify-content:center;background:none!important;color:var(--muted)}
  #rail a span{opacity:1}
  #rail a.on{color:var(--ink)!important}
  main{padding-bottom:80px}
  .hero{padding:80px 18px 20px;min-height:58vh}
  .row h2,.page>h1,.page>.sub,.search,.seasons,.page h2.sec{margin-left:18px;margin-right:18px}
  .track{padding:6px 18px 12px;scroll-padding:0 18px;gap:10px}
  .card{width:62vw}
  .card.poster{width:36vw}
  .grid{padding:0 18px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px 10px}
  .det{padding:80px 18px 10px}
  .tiles{gap:8px}
  .tile{min-width:72px;padding:12px 8px 8px}
  .tile.play{width:100%;justify-content:center}
  .reqs{padding:0 18px}
  .req{flex-wrap:wrap}
  .empty,.loading{padding-left:18px;padding-right:18px}
  .strip .nav{display:none}
  .pl-top,.pl-bot{padding:14px 16px}
  .pl-bot{padding-top:50px}
  .pl-row .hide-s{display:none}
  .pl-row{gap:6px}
  .pl-row .time{font-size:13px;margin:0 4px}
  .gb{height:40px;min-width:40px;padding:0 10px}
  .gb.big{height:46px;min-width:46px}
  .sug{flex-direction:column}
  .sug img{width:120px}
  #mobileTop{display:flex}
}
#mobileTop{display:none;position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 18px;align-items:center;justify-content:space-between}
#mobileTop img{height:30px}
.notice{position:fixed;top:28px;left:50%;transform:translateX(-50%);z-index:95;width:min(560px,calc(100% - 32px));background:rgba(18,21,28,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:18px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;gap:14px;align-items:flex-start;animation:drop .3s ease}
.notice b{display:block;font:800 18px var(--font)}
.notice p{margin:4px 0 0;color:#d6dae3;font-size:17px;white-space:pre-wrap}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="intro" hidden><video playsinline preload="auto" src="/everflix/intro.mp4"></video><button class="skip" type="button">Saltar</button></div>

<div id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <img class="logo" src="/everflix/logo-full.png" alt="Everflix">
    <h1>¿Quién está viendo?</h1>
    <p>Entra con tu usuario de Jellyfin, el mismo de la tele.</p>
    <input id="lgUser" name="username" autocomplete="username" placeholder="Usuario" required>
    <input id="lgPass" name="password" type="password" autocomplete="current-password" placeholder="Contraseña">
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn blue" type="submit" id="lgGo">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <nav id="rail" aria-label="Menú"></nav>
  <div class="stage" id="stage" aria-hidden="true"><i></i><i></i></div>
  <main id="main"></main>
</div>
<div id="player" hidden></div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ICO = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  movie: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 12h18M3 7.5h4M3 16.5h4M17 7.5h4M17 16.5h4"/>',
  stack: '<rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  yt: '<rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/>',
  tv: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
  cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  note: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  play: '<path d="M6 3.5v17a1 1 0 0 0 1.5.9l14-8.5a1 1 0 0 0 0-1.8l-14-8.5A1 1 0 0 0 6 3.5z" fill="currentColor" stroke="none"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/>',
  restart: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  heartFull: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z" fill="currentColor"/>',
  star: '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/>',
  globe: '<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5a14.5 14.5 0 0 1 0 19M12 2.5a14.5 14.5 0 0 0 0 19"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  info: '<circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4M12 8h.01"/>',
  back10: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="800" font-family="Archivo">10</text>',
  fwd10: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="800" font-family="Archivo">10</text>',
  next: '<path d="M5 4v16l11-8z" fill="currentColor" stroke="none"/><path d="M19 4v16"/>',
  subs: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h4m3 0h3M7 11h2m3 0h5"/>',
  gauge: '<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
  full: '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
  vol: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  mute: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  vt: '<path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/>',
};
const ico = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICO[n] || ""}</svg>`;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("show"), 3200); }

// ---------- hablar con Jellyfin (a través de Videotecario) y con Videotecario ----------
let me = null, views = [], ADMIN = false;
const FIELDS = "Overview,Genres,ProviderIds,PrimaryImageAspectRatio,ProductionYear,OfficialRating,CommunityRating,ChildCount,RecursiveItemCount,RunTimeTicks";
const qs = o => Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
async function jf(path, params, method = "GET", body) {
  const r = await fetch("/ef/jf" + path + (params ? "?" + qs(params) : ""), method === "GET" ? {} :
    {method, headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { showLogin(); throw new Error("hay que entrar"); }
  if (!r.ok) throw new Error("Jellyfin no respondió (" + r.status + ")");
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function vt(path, body) {
  try {
    const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    return await r.json();
  } catch (e) { return {ok: false, error: e.message}; }
}
const U = () => me.Id;

// imágenes: como «decorate» en la tele
function imgUrl(id, type, tag, w) { return `/ef/jf/Items/${id}/Images/${type}${type === "Backdrop" ? "/0" : ""}?maxWidth=${w}&quality=85${tag ? "&tag=" + tag : ""}`; }
function thumbOf(it, w = 560) {
  if (it.efThumb) return it.efThumb;
  const t = it.ImageTags || {};
  if (it.Type === "Episode" && t.Primary) return imgUrl(it.Id, "Primary", t.Primary, w);
  if (t.Thumb) return imgUrl(it.Id, "Thumb", t.Thumb, w);
  if ((it.BackdropImageTags || []).length) return imgUrl(it.Id, "Backdrop", it.BackdropImageTags[0], w);
  if (it.ParentThumbItemId) return imgUrl(it.ParentThumbItemId, "Thumb", it.ParentThumbImageTag, w);
  if (it.ParentBackdropItemId && (it.ParentBackdropImageTags || []).length) return imgUrl(it.ParentBackdropItemId, "Backdrop", it.ParentBackdropImageTags[0], w);
  if (it.SeriesId && it.SeriesPrimaryImageTag) return imgUrl(it.SeriesId, "Primary", it.SeriesPrimaryImageTag, w);
  if (t.Primary) return imgUrl(it.Id, "Primary", t.Primary, w);
  return "";
}
function posterOf(it, w = 360) {
  if (it.efPoster !== undefined) return it.efPoster;
  const t = it.ImageTags || {};
  if (t.Primary) return imgUrl(it.Id, "Primary", t.Primary, w);
  if (it.SeriesId && it.SeriesPrimaryImageTag) return imgUrl(it.SeriesId, "Primary", it.SeriesPrimaryImageTag, w);
  return "";
}
function backdropOf(it) {
  if (it.efBackdrop) return it.efBackdrop;
  if ((it.BackdropImageTags || []).length) return imgUrl(it.Id, "Backdrop", it.BackdropImageTags[0], 1920);
  if (it.ParentBackdropItemId && (it.ParentBackdropImageTags || []).length) return imgUrl(it.ParentBackdropItemId, "Backdrop", it.ParentBackdropImageTags[0], 1920);
  return thumbOf(it, 1280);
}
function logoOf(it) {
  const t = it.ImageTags || {};
  if (t.Logo) return imgUrl(it.Id, "Logo", t.Logo, 700);
  if (it.ParentLogoItemId && it.ParentLogoImageTag) return imgUrl(it.ParentLogoItemId, "Logo", it.ParentLogoImageTag, 700);
  return "";
}
const ticksMin = t => Math.round((t || 0) / 600000000);
function epCode(it) { return `T${it.ParentIndexNumber ?? "?"} · E${it.IndexNumber ?? "?"}`; }
function leftText(it) {
  const ud = it.UserData || {}, run = it.RunTimeTicks || 0;
  if (!ud.PlaybackPositionTicks || !run) return "";
  const m = ticksMin(run - ud.PlaybackPositionTicks);
  return m >= 60 ? `Quedan ${Math.floor(m / 60)} h ${m % 60} min` : `Quedan ${m} min`;
}
function runText(t) { const m = ticksMin(t); return !m ? "" : m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; }

// ---------- fondo con fundido entre dos capas ----------
let stageOn = 0, stageUrl = "";
function setStage(url) {
  if (url === stageUrl) return;
  if (!url) { stageUrl = ""; document.querySelectorAll("#stage i").forEach(i => i.classList.remove("on")); return; }
  stageUrl = url;
  const img = new Image();
  img.onload = () => {
    if (stageUrl !== url) return;
    const layers = document.querySelectorAll("#stage i");
    stageOn = 1 - stageOn;
    layers[stageOn].style.backgroundImage = `url("${url}")`;
    layers[stageOn].classList.add("on"); layers[1 - stageOn].classList.remove("on");
  };
  img.src = url;
}

// ---------- tarjetas y filas ----------
const store = new Map();  // id de tarjeta → elemento (Jellyfin o sugerencia de Videotecario)
let cardSeq = 0;
function keep(it) { const k = "c" + (++cardSeq); store.set(k, it); return k; }
function card(it, kind = "wide") {
  const k = keep(it), ud = it.UserData || {};
  let title = it.Name, sub = "";
  if (it.Type === "Episode") { title = it.SeriesName || it.Name; sub = `${epCode(it)} · ${it.Name}`; }
  else if (it.efNote) sub = it.efNote;
  else if (it.Type === "Series") sub = [it.ProductionYear, (it.Genres || [])[0]].filter(Boolean).join(" · ");
  else sub = [it.ProductionYear, runText(it.RunTimeTicks)].filter(Boolean).join(" · ");
  const src = it.efThumb || (kind === "poster" ? posterOf(it) : kind === "person" ? posterOf(it, 260) : thumbOf(it));
  const prog = ud.PlayedPercentage && !ud.Played ? ud.PlayedPercentage : 0;
  const unseen = it.Type === "Series" && ud.UnplayedItemCount ? ud.UnplayedItemCount : 0;
  return `<button class="card ${kind}" data-k="${k}" type="button">
    <div class="pic">${src ? `<img loading="lazy" src="${esc(src)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:${esc(JSON.stringify(title))}}))">` : `<div class="fallback">${esc(title)}</div>`}
      ${prog ? `<div class="bar"><i style="width:${prog.toFixed(1)}%"></i></div>` : ""}
      ${ud.Played ? `<div class="seen">${ico("check")}</div>` : ""}
      ${unseen && kind !== "person" ? `<div class="badge">${unseen}</div>` : ""}
      ${it.efSuggestion && !it.efSuggestion.have ? `<div class="badge">${ADMIN ? "Descargar" : "Pedir"}</div>` : ""}</div>
    ${kind === "person" ? `<b>${esc(it.Name)}</b>` : `<b>${esc(title)}</b><span>${esc(sub)}</span>`}</button>`;
}
function rowHtml(title, items, kind = "wide", extra = "") {
  if (!items || !items.length) return "";
  return `<section class="row"><h2>${esc(title)}${extra ? ` <small>${esc(extra)}</small>` : ""}</h2><div class="strip">
    <button class="nav l" type="button" aria-label="Anteriores">${ico("left")}</button>
    <div class="track">${items.map(it => card(it, kind)).join("")}</div>
    <button class="nav r" type="button" aria-label="Siguientes">${ico("right")}</button></div></section>`;
}
function wireCards(root, onFocus) {
  root.querySelectorAll(".strip").forEach(s => {
    const t = $(".track", s);
    $(".nav.l", s).onclick = () => t.scrollBy({left: -t.clientWidth * .85, behavior: "smooth"});
    $(".nav.r", s).onclick = () => t.scrollBy({left: t.clientWidth * .85, behavior: "smooth"});
  });
  root.querySelectorAll(".card[data-k]").forEach(c => {
    const it = store.get(c.dataset.k);
    c.onclick = () => openItem(it);
    if (onFocus) {
      let h;
      const go = () => { clearTimeout(h); h = setTimeout(() => onFocus(it), 220); };
      c.addEventListener("mouseenter", go); c.addEventListener("focus", go);

async function route() {

async function homeRows() {

  const forYou = {Recursive: true, IncludeItemTypes: "Series,Movie", SortOrder: "Descending", Limit: 30, ...common};
  const [resume, next, latest, mine, played] = await Promise.all([
    jf(`/Users/${U()}/Items/Resume`, {MediaTypes: "Video", Limit: 30, ...common}).catch(() => null),
    jf("/Shows/NextUp", {UserId: U(), Limit: 30, EnableResumable: true, EnableRewatching: false, ...common}).catch(() => null),
    jf(`/Users/${U()}/Items`, {...forYou, SortBy: "DateCreated"}).catch(() => null),
    jf(`/Users/${U()}/Items`, {...forYou, SortBy: "DateCreated", IsFavorite: true}).catch(() => null),
    jf(`/Users/${U()}/Items`, {Recursive: true, IncludeItemTypes: "Movie,Episode", IsPlayed: true, SortBy: "DatePlayed", SortOrder: "Descending", Limit: 80, Fields: "Genres", EnableTotalRecordCount: false}).catch(() => null)]);
  // Recomendado: por los géneros de lo que más ves; sin historial, un trozo que cambia cada día
  const p = {...forYou, IsPlayed: false};
  const genres = await favouriteGenres((played || {}).Items || []);
  if (genres.length) { p.Genres = genres.join("|"); p.SortBy = "CommunityRating"; }
  else { const d = new Date(), day = Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 864e5) + 1; p.SortBy = "PremiereDate"; p.StartIndex = (day * 7) % 120; }
  const skip = await courseIds();
  if (skip.length) p.ExcludeItemIds = skip.join(",");
  const rec = await jf(`/Users/${U()}/Items`, p).catch(() => null);
  const L = x => (x && x.Items) || [];
  return [["Continuar viendo", L(resume)], ["Siguiente", L(next)], ["Recomendado para ti", L(rec)],
          ["Lo último en tu biblioteca", L(latest)], ["Mi lista", L(mine)]].filter(r => r[1].length);
}
async function favouriteGenres(played) {
  const counts = {}, perSeries = {};
  played.forEach(it => {
    if (it.Type === "Movie") (it.Genres || []).forEach(g => counts[g] = (counts[g] || 0) + 1);
    else if (it.SeriesId) perSeries[it.SeriesId] = (perSeries[it.SeriesId] || 0) + 1;
  });
  const ids = Object.keys(perSeries);
  if (ids.length) {
    const s = await jf(`/Users/${U()}/Items`, {Ids: ids.join(","), Fields: "Genres"}).catch(() => null);
    ((s && s.Items) || []).forEach(x => (x.Genres || []).forEach(g => counts[g] = (counts[g] || 0) + Math.min(5, perSeries[x.Id] || 1)));
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
}
let courseCache = null;
async function courseIds() {  // los cursos (Academy, Cursos) se ven a propósito: nunca se recomiendan

}

  jpn: "Japonés", ja: "Japonés", ita: "Italiano", it: "Italiano", ger: "Alemán", deu: "Alemán", de: "Alemán", kor: "Coreano", ko: "Coreano", chi: "Chino", zho: "Chino", zh: "Chino",
  rus: "Ruso", ru: "Ruso", dut: "Neerlandés", nld: "Neerlandés", pol: "Polaco", swe: "Sueco", nor: "Noruego", dan: "Danés", fin: "Finés", tur: "Turco", ara: "Árabe", heb: "Hebreo",
  hin: "Hindi", tha: "Tailandés", gre: "Griego", ell: "Griego", cze: "Checo", ces: "Checo", hun: "Húngaro", rum: "Rumano", ron: "Rumano", ukr: "Ucraniano", cat: "Catalán", glg: "Gallego",
  baq: "Euskera", eus: "Euskera", vie: "Vietnamita", ind: "Indonesio", und: "Desconocido", mul: "Varios", zxx: "Sin idioma"};
const langName = c => !c ? "Desconocido" : LANG[c.toLowerCase()] || c.toUpperCase();
const isSpanish = c => ["spa", "es", "esp"].includes((c || "").toLowerCase());
function langPref() { try { return JSON.parse(localStorage.getItem("efLang") || "{}"); } catch (e) { return {}; } }
function setLangPref(p) { try { localStorage.setItem("efLang", JSON.stringify(p)); } catch (e) {} }
function langsOf(streams, type) { const out = []; (streams || []).forEach(s => { if (s.Type === type) { const c = s.Language || "und"; if (!out.includes(c)) out.push(c); } }); return out; }
// Subtítulos en español por defecto (lo normal en casa: audio en inglés con subtítulos en español)
function pickLangs(streams) {
  const audios = langsOf(streams, "Audio"), subs = langsOf(streams, "Subtitle"), pref = langPref();
  let audio = pref.audio && audios.includes(pref.audio) ? pref.audio : audios[0];
  let sub = pref.sub !== undefined ? (pref.sub === "" ? "" : subs.includes(pref.sub) ? pref.sub : null) : null;
  if (sub === null) sub = subs.find(isSpanish) || subs[0] || "";
  if (isSpanish(audio) && pref.sub === undefined) sub = "";  // ya se oye en español
  return {audios, subs, audio, sub};
}

async function detailAction(k, target) {
  const it = det.item;
  if (k === "play" && target) return go(`#/ver/${target.Id}`);
  if (k === "restart" && target) return go(`#/ver/${target.Id}?t=0`);
  if (k === "played") {
    const on = !(it.UserData || {}).Played;
    await jf(`/Users/${U()}/PlayedItems/${it.Id}`, null, on ? "POST" : "DELETE");
    it.UserData = {...(it.UserData || {}), Played: on};
    toast(on ? "Marcado como visto" : "Marcado como no visto");
    if (it.Type === "Series") await loadEpisodes();
    return paintDetails();
  }
  if (k === "favorite") {
    const on = !(it.UserData || {}).IsFavorite;
    await jf(`/Users/${U()}/FavoriteItems/${it.Id}`, null, on ? "POST" : "DELETE");
    it.UserData = {...(it.UserData || {}), IsFavorite: on};
    toast(on ? "Añadida a Mi lista" : "Quitada de Mi lista");
    return paintDetails();
  }
  if (k === "rate") {
    const cur = det.rating == null ? "" : String(det.rating);
    const v = await choose("Calificar", "Mejora lo que te recomienda Videotecario.", [["2", "Me encanta"], ["1", "Me gusta"], ["-1", "No me gusta"], ["x", "Quitar calificación"]], cur);
    if (v === null) return;
    const rating = v === "x" ? null : +v;
    const r = await vt("/api/pedir/rate", {...det.rateRef, rating});
    if (!r.ok) return toast(r.error || "No se pudo guardar");
    det.rating = rating; toast(rating == null ? "Calificación quitada" : "Calificada"); return paintDetails();
  }
  if (k === "follow") {
    const on = !det.following;
    const r = await vt("/api/pedir/autofollow", {item: det.rateRef, on});
    if (!r.ok) return toast(r.error || "No se pudo guardar");
    det.following = on; toast(on ? "Siguiendo: lo nuevo se bajará solo" : "Ya no la sigues"); return paintDetails();
  }
  if (k === "langs") {
    const L = det.langs, opts = [];
    if (L.audios.length) { opts.push(["#", "AUDIO"]); L.audios.forEach(c => opts.push(["a:" + c, langName(c), c === L.audio])); }
    if (L.subs.length) { opts.push(["#", "SUBTÍTULOS"]); L.subs.forEach(c => opts.push(["s:" + c, langName(c), c === L.sub])); opts.push(["s:", "Sin subtítulos", L.sub === ""]); }
    const v = await choose("Idioma", "Se recuerda para lo próximo que veas.", opts);
    if (v === null) return;
    const p = langPref();
    if (v.startsWith("a:")) p.audio = v.slice(2); else p.sub = v.slice(2);
    setLangPref(p); paintDetails();
  }
}
// menú de opciones (como los desplegables de la tele)
function choose(title, sub, opts, current) {
  return new Promise(done => {
    const s = document.createElement("div");
    s.className = "sheet";
    s.innerHTML = `<div class="box" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${sub ? `<p style="color:var(--muted);margin:0 0 10px">${esc(sub)}</p>` : ""}
      ${opts.map(([k, t, sel]) => k === "#" ? `<div class="head">${esc(t)}</div>` : `<button class="opt ${sel || k === current ? "sel" : ""}" data-v="${esc(k)}">${esc(t)}</button>`).join("")}</div>`;
    const close = v => { s.remove(); document.removeEventListener("keydown", key); done(v); };
    const key = e => { if (e.key === "Escape") close(null); };
    s.onclick = e => { if (e.target === s) close(null); const b = e.target.closest("[data-v]"); if (b) close(b.dataset.v); };
    document.addEventListener("keydown", key);
    document.body.appendChild(s);
    (s.querySelector(".opt.sel") || s.querySelector(".opt"))?.focus();
  });
}

// ---------- lo de fuera de la biblioteca: pedir / descargar / abrir lo que ya tienes ----------
async function findOwned(s) {
  const kind = s.kind === "tv" ? "Series" : "Movie", tmdb = String(s.tmdb);
  const base = {Recursive: true, IncludeItemTypes: kind, Fields: "ProviderIds", EnableTotalRecordCount: false, Limit: 20};
  let named = null;
  for (const p of [{AnyProviderIdEquals: "Tmdb." + tmdb}, {SearchTerm: s.title}]) {
    const r = await jf(`/Users/${U()}/Items`, {...base, ...p}).catch(() => null);
    for (const it of (r && r.Items) || []) {
      if (((it.ProviderIds || {}).Tmdb || "") === tmdb && it.Type === kind) return it.Id;
      if (!named && (it.Name || "").toLowerCase() === (s.title || "").toLowerCase() && it.Type === kind) named = it.Id;
    }
  }
  return named;
}
async function openSuggestion(s) {
  if (s.have) {
    const id = await findOwned(s);
    if (id) return go(`#/ficha/${id}`);
  }
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const asked = s.asked;
  sheet.innerHTML = `<div class="box wide" role="dialog"><div class="sug">${s.poster ? `<img src="${esc(s.poster)}" alt="">` : ""}<div>
    <div class="kicker"><span class="tag">${s.kind === "tv" ? "Serie" : "Película"}</span>${esc(s.year || "")}</div>
    <h3 style="font-size:28px;margin:10px 0 8px">${esc(s.title)}</h3><p style="color:#d6dae3;margin:0">${esc(s.overview || "")}</p>
    <div class="acts">${s.have ? `<span class="pill ok">En tu biblioteca</span>` : asked ? `<span class="pill blue">${ADMIN ? "Ya está en Descargas" : "Ya lo pediste"}</span>`
      : `<button class="btn blue" data-a="ask">${ico("plus")}${ADMIN ? "Descargar" : "Pedir"}</button>`}<button class="btn" data-a="close">Cerrar</button></div></div></div></div>`;
  document.body.appendChild(sheet);
  sheet.onclick = async e => {
    const a = e.target.closest("[data-a]");
    if (e.target === sheet || (a && a.dataset.a === "close")) return sheet.remove();
    if (a && a.dataset.a === "ask") {
      a.disabled = true;
      const r = await vt("/api/pedir/ask", {item: {kind: s.kind, tmdb: s.tmdb, title: s.title, year: s.year, poster: s.poster, overview: s.overview}});
      sheet.remove();
      if (!r.ok) return toast(r.error || "No se pudo");
      s.asked = "pendiente";
      toast(ADMIN ? `A descargar: ${s.title}. Aparecerá sola en tu biblioteca.` : `Pedido enviado: ${s.title}. Se descargará cuando se apruebe.`);
    }
  };
}

const ytDur = d => !d ? "" : d >= 3600 ? `${Math.floor(d / 3600)}:${String(Math.floor(d % 3600 / 60)).padStart(2, "0")}:${String(d % 60).padStart(2, "0")}` : `${Math.floor(d / 60)}:${String(d % 60).padStart(2, "0")}`;
const ytNum = n => n >= 1e9 ? (n / 1e9).toFixed(1).replace(".0", "") + " mil M" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + " M" : n >= 1e3 ? Math.round(n / 1e3) + " K" : String(n || 0);
const fmtSubs = n => n ? ytNum(n) + " suscriptores" : "";
function ytAgo(t) {
  if (!t) return "";
  const s = Date.now() / 1000 - t, u = [[31536000, "año", "años"], [2592000, "mes", "meses"], [604800, "semana", "semanas"], [86400, "día", "días"], [3600, "hora", "horas"], [60, "minuto", "minutos"]];
  for (const [n, a, b] of u) if (s >= n) { const k = Math.floor(s / n); return `hace ${k} ${k === 1 ? a : b}`; }
  return "ahora mismo";
}
const YT = {chans: {}, st: {}, list: [], seq: 0};
const YT_NAV = [["inicio", "home", "Inicio"], ["shorts", "bolt", "Shorts"], ["suscripciones", "tv", "Suscripciones", 1], ["-"], ["canales", "user", "Canales", 1],
  ["listas", "stack", "Listas", 1], ["historial", "clock", "Historial"], ["tarde", "clock", "Ver más tarde", 1], ["megusta", "heart", "Vídeos que me gustan", 1]];
const YT_CHIPS = ["Todo", "Música", "Videojuegos", "En directo", "Noticias", "Deportes", "Películas", "Comedia", "Ciencia", "Cocina", "Podcasts", "Tecnología"];
function ytAv(v) {

}
function ytTile(v, n) {

    <div class="info">${v.channel_id ? `<button class="avb" data-ch="${esc(v.channel_id)}" type="button">${ytAv(v)}</button>` : ytAv(v)}

function ytShort(v, n) {

// pinta vídeos y deja guardada la lista para «siguiente»
function ytWire(root, list) {
  root.querySelectorAll("[data-n]").forEach(el => {
    const v = list[+el.dataset.n];
    const open = () => ytWatch(v, list);
    if (el.matches(".yts")) el.onclick = open;
    el.querySelectorAll(".pic,.t").forEach(b => b.onclick = open);
  });
  root.querySelectorAll("[data-ch]").forEach(b => b.onclick = e => { e.stopPropagation(); ytGo("canal", b.dataset.ch); });
}

const ytLoading = () => `<div class="loading" style="padding-top:30px"><div class="spin"></div>Cargando…</div>`;
const ytEmpty = (r, t) => `<p class="empty">${r && r.ok === false ? "YouTube no responde ahora mismo. Prueba otra vez en un rato." : esc(t)}</p>`;
async function ytGo(view, arg) {
  const body = $("#ytBody");
  if (!body) return;
  closeWatch();
  const my = ++YT.seq;
  document.querySelectorAll(".ytside [data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  body.innerHTML = ytLoading();
  const done = () => my === YT.seq;
  const grid = (items, empty, r) => { YT.list = items; body.innerHTML = items.length ? `<div class="ytgrid">${items.map(ytTile).join("")}</div>` : ytEmpty(r, empty); ytWire(body, items); };
  if (view === "inicio" || view === "chip") {
    const chip = view === "chip" ? arg : "Todo";
    const chips = `<div class="ytchips">${YT_CHIPS.map(c => `<button class="${c === chip ? "on" : ""}" type="button">${c}</button>`).join("")}</div>`;
    if (view === "chip") {
      const r = await vt("/api/yt/search?q=" + encodeURIComponent(chip === "En directo" ? "en directo ahora" : chip));
      if (!done()) return;

      body.innerHTML = chips + `<div class="ytgrid">${items.map(ytTile).join("")}</div>`;
      ytWire(body, items);

      if (!done()) return;
      const rows = (r.ok && r.rows) || [], shorts = ((sh.ok && sh.items) || []).slice(0, 12);
      const main = rows.find(x => x.tab === "inicio") || rows.find(x => x.title === "Tendencias") || rows[0];
      if (!main) { body.innerHTML = chips + ytEmpty(r, "Nada por aquí."); }
      else {
        const hero = main.items[0], rest = main.items.slice(1, 13), lists = [main.items, shorts];
        let html = chips + `<div class="ythero" data-n="0"><button class="pic" type="button"><img src="https://i.ytimg.com/vi/${esc(hero.id)}/maxresdefault.jpg" onerror="this.src='${esc(hero.thumb)}'" alt="">${hero.duration ? `<i>${ytDur(hero.duration)}</i>` : ""}</button>
          <div><small>${esc(main.title)}</small><h2>${esc(hero.title)}</h2><button class="c" ${hero.channel_id ? `data-ch="${esc(hero.channel_id)}"` : ""} type="button">${ytAv(hero)}${esc(hero.channel)}</button>

        if (shorts.length) html += `<h3 class="ytsec">${ico("bolt")}Shorts</h3><div class="ytshorts" data-l="1">${shorts.map(ytShort).join("")}</div>`;
        rows.filter(x => x !== main).forEach((x, k) => { lists.push(x.items); html += `<h3 class="ytsec">${esc(x.title)}</h3><div class="ytgrid" data-l="${k + 2}">${x.items.slice(0, 8).map(ytTile).join("")}</div>`; });
        body.innerHTML = html;
        $("#heroPlay").onclick = () => ytWatch(hero, main.items);
        $(".ythero .pic").onclick = () => ytWatch(hero, main.items);
        body.querySelectorAll("[data-l]").forEach(el => ytWire(el, lists[+el.dataset.l]));
        ytWire($(".ythero"), [hero]);
      }
    }
    body.querySelectorAll(".ytchips button").forEach(b => b.onclick = () => b.textContent === "Todo" ? ytGo("inicio") : ytGo("chip", b.textContent));
  } else if (view === "shorts") {
    const r = await vt("/api/yt/shorts");
    if (!done()) return;
    const items = (r.ok && r.items) || [];
    body.innerHTML = items.length ? `<h3 class="ytsec">${ico("bolt")}Shorts</h3><div class="ytshorts wrap">${items.map(ytShort).join("")}</div>` : ytEmpty(r, "No hay Shorts.");
    ytWire(body, items);
  } else if (view === "buscar") {
    const r = await vt("/api/yt/search?q=" + encodeURIComponent(arg));
    if (!done()) return;
    grid((r.ok && r.items) || [], `Nada con «${arg}».`, r);
  } else if (view === "canales") {
    const r = await vt("/api/yt/channels");

      <div><button class="t" type="button">${esc(x.title)}</button><button class="c" type="button">${esc(x.channel)}</button><span>${esc([x.views ? ytNum(x.views) + " vistas" : "", ytAgo(x.when)].filter(Boolean).join(" · "))}</span></div></div>`).join("") || `<p class="sub">Nada más.</p>`;

  [...v.querySelectorAll("track")].forEach(t => t.remove());
  const subStream = (ms.MediaStreams || []).find(s => s.Index === P.sub);
  const burn = subStream && !subStream.IsTextSubtitleStream;  // subtítulos de imagen (PGS): hay que grabarlos en el video
  const direct = P.quality === "auto" && !burn && directOk(ms, P.audio);
  P.method = direct ? "DirectPlay" : "Transcode";
  let src;
  if (direct) {
    src = `/ef/jf/Videos/${item.Id}/stream?` + qs({static: true, MediaSourceId: ms.Id, PlaySessionId: P.session});
  } else {
    const p = {MediaSourceId: ms.Id, PlaySessionId: P.session, VideoCodec: "h264", AudioCodec: "aac", AudioStreamIndex: P.audio, TranscodingMaxAudioChannels: 2,
      SegmentContainer: "ts", MinSegments: 1, BreakOnNonKeyFrames: true, h264Profile: "high,main,baseline", h264Level: 51,
      AllowVideoStreamCopy: P.quality === "auto" || P.quality === "orig", AllowAudioStreamCopy: true, StartTimeTicks: 0};
    if (/^\d+$/.test(P.quality)) { p.MaxStreamingBitrate = P.quality; p.VideoBitrate = Math.round(P.quality * .9); p.AudioBitrate = 192000; }
    else p.MaxStreamingBitrate = 120000000;
    if (burn) { p.SubtitleStreamIndex = P.sub; p.SubtitleMethod = "Encode"; }
    src = `/ef/jf/Videos/${item.Id}/master.m3u8?` + qs(p);
  }
  if (subStream && !burn) {
    const t = document.createElement("track");
    t.kind = "subtitles"; t.srclang = subStream.Language || "und"; t.label = langName(subStream.Language); t.default = true;
    t.src = `/ef/jf/Videos/${item.Id}/${ms.Id}/Subtitles/${subStream.Index}/0/Stream.vtt`;
    v.appendChild(t);
    t.addEventListener("load", () => { t.track.mode = "showing"; cuesUp($("#player").classList.contains("ui")); });
    setTimeout(() => { if (v.textTracks[0]) v.textTracks[0].mode = "showing"; }, 400);
  }
  const begin = () => { if (at > 1) v.currentTime = at; v.play().catch(() => { $("#plPlay").innerHTML = ico("play"); $("#plSpin").hidden = true; }); };
  if (direct || v.canPlayType("application/vnd.apple.mpegurl")) {
    v.src = src;
    v.addEventListener("loadedmetadata", begin, {once: true});
    v.onerror = () => { if (P && P.method === "DirectPlay") { P.quality = "orig"; loadSource(v.currentTime || at); } else toast("No se pudo reproducir"); };
  } else {
    try { await loadHls(); } catch (e) { return toast("No se pudo cargar el reproductor"); }
    const hls = new Hls({xhrSetup: x => { x.withCredentials = true; }, maxBufferLength: 40, startPosition: at > 1 ? at : -1});
    P.hls = hls;
    hls.loadSource(src); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => { $("#plPlay").innerHTML = ico("play"); $("#plSpin").hidden = true; }));
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad(); else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError(); else toast("No se pudo reproducir"); } });
  }
}
function playBody(extra = {}) {
  return {ItemId: P.item.Id, MediaSourceId: P.ms.Id, PlaySessionId: P.session, PositionTicks: Math.floor((P.video ? P.video.currentTime : P.start) * 1e7),
    IsPaused: P.video ? P.video.paused : false, PlayMethod: P.method, CanSeek: true, AudioStreamIndex: P.audio, SubtitleStreamIndex: P.sub, ...extra};
}
function report(kind) {  // para que Jellyfin sepa por dónde vas (Continuar viendo, «Viendo ahora»)
  if (!P || !P.video) return;
  P.lastReport = Date.now();
  fetch("/ef/jf/Sessions/Playing" + (kind ? "/" + kind : ""), {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(playBody()), keepalive: kind === "Stopped"}).catch(() => {});
}
async function langMenu() {
  const s = P.ms.MediaStreams || [], opts = [];
  const aud = s.filter(x => x.Type === "Audio"), subs = s.filter(x => x.Type === "Subtitle");
  if (aud.length) { opts.push(["#", "AUDIO"]); aud.forEach(a => opts.push(["a:" + a.Index, `${langName(a.Language)}${a.Title && !/^(spa|eng|es|en)/i.test(a.Title) ? " · " + a.Title : ""} · ${(a.Codec || "").toUpperCase()} ${a.Channels ? a.Channels + "ch" : ""}`, a.Index === P.audio])); }
  opts.push(["#", "SUBTÍTULOS"]);
  subs.forEach(x => opts.push(["s:" + x.Index, `${langName(x.Language)}${x.IsForced ? " (forzados)" : ""}${x.IsExternal ? "" : " · " + (x.Codec || "").toUpperCase()}`, x.Index === P.sub]));
  opts.push(["s:-1", "Sin subtítulos", P.sub === -1]);
  const v = await panel("Audio y subtítulos", opts);
  if (v === null) return;
  const t = P.video.currentTime, p = langPref();
  if (v.startsWith("a:")) { P.audio = +v.slice(2); p.audio = (aud.find(a => a.Index === P.audio) || {}).Language || "und"; }
  else { P.sub = +v.slice(2); p.sub = P.sub === -1 ? "" : (subs.find(x => x.Index === P.sub) || {}).Language || "und"; }
  setLangPref(p);
  report("Stopped"); P.session = crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : String(Math.random()).slice(2);
  await loadSource(t); report("");
}
async function speedMenu() {
  const cur = P.video.playbackRate;
  const v = await panel("Velocidad", [.5, .75, 1, 1.25, 1.5, 2].map(x => [String(x), x === 1 ? "Normal" : x + "×", x === cur]));
  if (v === null) return;
  P.video.playbackRate = +v; $("#plSpeedT").textContent = v + "×";
}
async function qualityMenu() {
  const v = await panel("Calidad", QUALITY.map(([k, t]) => [k, t + (k === "auto" ? " · sin convertir si se puede" : ""), k === P.quality]));
  if (v === null || v === P.quality) return;
  P.quality = v; try { localStorage.setItem("efQuality", v); } catch (e) {}
  const t = P.video.currentTime; report("Stopped"); await loadSource(t); report("");
}
function panel(title, opts) {  // panel de cristal dentro del reproductor
  return new Promise(done => {
    $(".pl-panel")?.remove();
    const p = document.createElement("div");
    p.className = "pl-panel";
    p.innerHTML = `<div class="sheet" style="position:static;background:none;padding:0;display:block;animation:none"><h3 style="margin:8px 14px 6px">${esc(title)}</h3>
      ${opts.map(([k, t, sel]) => k === "#" ? `<div class="head">${esc(t)}</div>` : `<button class="opt ${sel ? "sel" : ""}" data-v="${esc(k)}">${esc(t)}</button>`).join("")}</div>`;
    const close = v => { p.remove(); document.removeEventListener("pointerdown", out, true); done(v); poke(); };
    const out = e => { if (!p.contains(e.target)) close(null); };
    p.onclick = e => { const b = e.target.closest("[data-v]"); if (b) close(b.dataset.v); };
    $("#player").appendChild(p);
    setTimeout(() => document.addEventListener("pointerdown", out, true));
    $("#player").classList.add("ui");
    p._close = close;
  });
}
// «Saltar intro» / «Saltar créditos» (los marca Videotecario o Intro Skipper)
function skipPaint(t) {
  const k = P.skips && (["intro", "credits"].find(x => P.skips[x] && t >= P.skips[x][0] && t < P.skips[x][1] - 1));
  let b = $("#plSkip");
  if (!k) { if (b) b.remove(); return; }
  if (b && b.dataset.k === k) return;
  if (!b) { b = document.createElement("button"); b.id = "plSkip"; b.className = "btn pri pl-skip"; $("#player").appendChild(b); }
  b.dataset.k = k;
  b.innerHTML = `${ico("next")}${k === "intro" ? "Saltar intro" : P.next ? "Siguiente capítulo" : "Saltar créditos"}`;
  b.onclick = e => { e.stopPropagation(); const seg = P.skips[k]; b.remove();
    if (k === "credits" && P.next) return playNext();
    seekTo(Math.min(seg[1], dur() - 1)); };
}
function showNext() {
  P.nextShown = true;
  const n = P.next, box = document.createElement("div");
  box.className = "pl-next";
  box.innerHTML = `<img src="${esc(thumbOf(n, 400))}" alt=""><div class="t"><span>Siguiente capítulo</span><b>${epCode(n)} · ${esc(n.Name)}</b>
    <div class="acts" style="margin-top:10px"><button class="btn pri" data-a="go">${ico("play")}Ver ahora</button><button class="btn" data-a="no">Cerrar</button></div></div>`;
  box.onclick = e => { const a = e.target.closest("[data-a]"); if (!a) return; box.remove(); if (a.dataset.a === "go") playNext(); };
  $("#player").appendChild(box);
}
function playNext() { if (!P || !P.next) return toast("No hay siguiente capítulo"); const id = P.next.Id; report("Stopped"); location.replace(`#/ver/${id}`); }
async function ended() {
  report("Stopped");
  if (P.next) return playNext();
  // al terminar una película: calificar (como en la tele), sólo el administrador
  const it = P.item, tmdb = (it.ProviderIds || {}).Tmdb;
  if (ADMIN && it.Type === "Movie" && tmdb) {
    const box = document.createElement("div");
    box.className = "pl-rate";
    box.innerHTML = `<div class="box"><h3>¿Qué te ha parecido ${esc(it.Name)}?</h3><div class="acts" style="justify-content:center">
      <button class="btn" data-r="2">${ico("heart")}Me encanta</button><button class="btn" data-r="1">Me gusta</button><button class="btn" data-r="-1">No me gusta</button><button class="btn" data-r="x">Ahora no</button></div></div>`;
    box.onclick = async e => {
      const b = e.target.closest("[data-r]"); if (!b) return;
      if (b.dataset.r !== "x") { await vt("/api/pedir/rate", {kind: "movie", tmdb, title: it.Name, year: it.ProductionYear, rating: +b.dataset.r}); toast("Gracias: mejora tus recomendaciones"); }
      history.back();
    };
    $("#player").appendChild(box);
    return;
  }
  history.back();
}
function closePlayer(silent) {
  const el = $("#player");
  if (!P && el.hidden) return;
  if (P) { report("Stopped"); if (P.hls) P.hls.destroy(); if (P.video) { P.video.pause(); P.video.removeAttribute("src"); P.video.load(); } }
  P = null; el.hidden = true; el.innerHTML = "";
  document.documentElement.style.overflow = "";
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
window.addEventListener("pagehide", () => { if (P) report("Stopped"); });
document.addEventListener("keydown", e => {
  if (!P || $("#player").hidden || e.target.closest("input,textarea")) return;
  const panelOpen = $(".pl-panel");
  if (e.key === "Escape") { if (panelOpen) panelOpen._close(null); else if (!document.fullscreenElement) history.back(); return; }
  if (panelOpen) return;
  const k = e.key;
  if (k === " " || k === "k") { e.preventDefault(); togglePlay(); }
  else if (k === "ArrowLeft") { e.preventDefault(); skip(-10); }
  else if (k === "ArrowRight") { e.preventDefault(); skip(10); }
  else if (k === "ArrowUp") { e.preventDefault(); P.video.volume = Math.min(1, P.video.volume + .1); flash(Math.round(P.video.volume * 100) + " %"); }
  else if (k === "ArrowDown") { e.preventDefault(); P.video.volume = Math.max(0, P.video.volume - .1); flash(Math.round(P.video.volume * 100) + " %"); }
  else if (k === "f") toggleFull();
  else if (k === "m") P.video.muted = !P.video.muted;
  else if (k === "n" && P.next) playNext();
  poke();
});

// ---------- el canal de Jellyfin: mensajes y órdenes desde el panel (Videotecario o Jellyfin) ----------
let ws = null, wsKeep = 0, wsRetry = 1000;
let lastNotice = {k: "", t: 0};
function showNotice(header, text, ms) {
  const k = (header || "") + "|" + (text || "");
  if (k === lastNotice.k && Date.now() - lastNotice.t < 60000) return;  // llegó por los dos caminos
  lastNotice = {k, t: Date.now()};
  document.querySelectorAll(".notice").forEach(n => n.remove());
  const n = document.createElement("div");
  n.className = "notice"; n.setAttribute("role", "alert");
  n.innerHTML = `<div>${header ? `<b>${esc(header)}</b>` : ""}<p${header ? "" : ' style="margin:0"'}>${esc(text || "")}</p></div>`;
  n.onclick = () => n.remove();
  (document.fullscreenElement || document.body).appendChild(n);
  setTimeout(() => n.remove(), Math.max(4000, +ms || 10000));
}
function wsCommand(m) {
  const d = m.Data || {};
  if (m.MessageType === "ForceKeepAlive") { clearInterval(wsKeep); wsKeep = setInterval(() => wsSend("KeepAlive"), Math.max(10, (+d || 60) / 2) * 1000); return; }
  if (m.MessageType === "GeneralCommand") {
    const a = d.Arguments || {}, v = P && P.video;
    if (d.Name === "DisplayMessage") return showNotice(a.Header, a.Text, a.TimeoutMs);
    if (!v) return;
    if (d.Name === "SetVolume") v.volume = Math.min(1, Math.max(0, (+a.Volume || 0) / 100));
    else if (d.Name === "Mute") v.muted = true;
    else if (d.Name === "Unmute") v.muted = false;
    else if (d.Name === "ToggleMute") v.muted = !v.muted;
    return;
  }
  if (m.MessageType === "Playstate" && P && P.video) {
    const v = P.video, c = d.Command;
    if (c === "Stop") efStop();
    else if (c === "Pause") v.pause();
    else if (c === "Unpause") v.play();
    else if (c === "PlayPause") v.paused ? v.play() : v.pause();
    else if (c === "Seek") seekTo((+d.SeekPositionTicks || 0) / 1e7);
    else if (c === "NextTrack" && P.next) playNext();
  }
}
function efStop() {
  if (!P || P.stopping) return;
  P.stopping = true;
  showNotice("Everflix", "Han parado lo que estabas viendo.");
  history.back();
}
// el buzón de Videotecario (como la Roku): llega aunque el canal de Jellyfin no se abra
async function inboxCheck() {
  if (!me || document.hidden) return;
  try {
    const r = await (await fetch("/api/ef/inbox")).json();
    (r.items || []).forEach(x => x.kind === "stop" ? efStop() : showNotice(x.header, x.text));
  } catch (e) {}
}
setInterval(inboxCheck, 5000);
function wsSend(type, data) { try { ws && ws.readyState === 1 && ws.send(JSON.stringify({MessageType: type, Data: data})); } catch (e) {} }
function wsConnect() {
  if (!me || (ws && ws.readyState < 2)) return;
  try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ef/socket"); } catch (e) { return; }
  ws.onopen = () => {
    wsRetry = 1000;
    jf("/Sessions/Capabilities/Full", null, "POST", {PlayableMediaTypes: ["Video"], SupportsMediaControl: true,
      SupportedCommands: ["DisplayMessage", "SetVolume", "Mute", "Unmute", "ToggleMute"]}).catch(() => {});
  };
  ws.onmessage = e => { try { wsCommand(JSON.parse(e.data)); } catch (x) {} };
  ws.onclose = () => { clearInterval(wsKeep); ws = null; if (me) setTimeout(wsConnect, wsRetry = Math.min(wsRetry * 2, 60000)); };
}

// ---------- entrar y arrancar ----------
function showLogin() {
  $("#app").hidden = true; $("#login").hidden = false; closePlayer(true);
  setTimeout(() => $("#lgUser").focus(), 50);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  $("#lgErr").textContent = ""; $("#lgGo").disabled = true;
  try {
    const r = await fetch("/api/ef/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user: $("#lgUser").value, password: $("#lgPass").value})});
    const j = await r.json();
    if (!j.ok) { $("#lgErr").textContent = j.error || "No se pudo entrar"; return; }
    $("#login").hidden = true;
    await intro(true);
    await boot(j.user);
  } catch (x) { $("#lgErr").textContent = "No se pudo hablar con Videotecario"; }
  finally { $("#lgGo").disabled = false; }
};
// la E de la intro, con su sonido, una vez por visita (si el navegador no deja sonido, sin él)
function intro(force) {
  return new Promise(done => {
    let seen = false; try { seen = sessionStorage.getItem("efIntro") === "1"; sessionStorage.setItem("efIntro", "1"); } catch (e) {}
    if (seen && !force) return done();
    const box = $("#intro"), v = $("video", box);
    box.hidden = false;
    const end = () => { box.hidden = true; v.pause(); done(); };
    v.onended = end; box.onclick = end; $(".skip", box).onclick = e => { e.stopPropagation(); end(); };
    v.currentTime = 0;
    v.play().catch(() => { v.muted = true; v.play().catch(end); });
    setTimeout(() => { if (!box.hidden) end(); }, 9000);
  });
}
async function boot(user) {
  me = user || (await jf("/Users/Me"));
  ADMIN = !!(me.Policy || {}).IsAdministrator;
  const v = await jf(`/Users/${U()}/Views`).catch(() => ({Items: []}));
  views = v.Items || [];
  courseCache = null;
  paintRail();
  wsConnect();
  $("#login").hidden = true; $("#app").hidden = false;
  route();
}
(async () => {
  let r;
  try { r = await (await fetch("/api/ef/me")).json(); } catch (e) { r = {ok: false}; }
  if (!r.ok) return showLogin();
  await intro(false);
  boot(r.user);
})();
</script>
