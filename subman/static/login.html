<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Videotecario</title>
<meta name="theme-color" content="#f1f2fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110e1f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Videotecario">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f2fb;--card:#fff;--line:#dedbf0;--text:#16122b;--muted:#4f4a68;--accent:#5b3df5;--accent-ink:#fff;--bad:#b4402f;
  --shadow:0 2px 6px rgb(40 25 10/.08),0 24px 60px -20px rgb(40 25 10/.3);--ease-out:cubic-bezier(0.23,1,0.32,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#110e1f;--card:#1b1730;--line:#332c55;--text:#f2efff;--muted:#aaa3c8;--accent:#9481ff;--accent-ink:#0e0a24;--bad:#f08070;
  --shadow:0 2px 8px rgb(0 0 0/.4),0 30px 80px -20px rgb(0 0 0/.75);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 "Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding:24px max(18px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom))}
form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 28px;box-shadow:var(--shadow);animation:in .35s var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
img{width:56px;height:56px;border-radius:14px;display:block}
h1{font:800 34px/1.1 "Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em;margin:18px 0 4px}
p{color:var(--muted);margin:0 0 22px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);transition:border-color .16s,box-shadow .16s}
input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button{width:100%;margin-top:22px;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:16px;cursor:pointer;
  touch-action:manipulation;transition:transform .16s var(--ease-out),opacity .16s}
button:active{transform:scale(.97)}
button:disabled{opacity:.6}
#err{color:var(--bad);font-weight:500;margin:14px 0 0;min-height:1.5em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<form id="f">
  <img src="/icon.svg" alt="">
  <h1>Videotecario</h1>
  <p>Entra para ver tu biblioteca.</p>
  <label for="user">Usuario</label>
  <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button id="go">Entrar</button>
  <div id="err" role="alert"></div>
  <p style="margin:14px 0 0;font-size:13px">¿Olvidaste la contraseña? Entra con tu usuario de administrador de Jellyfin y ponte otra en Ajustes.</p>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: document.getElementById("user").value, password: document.getElementById("password").value})});
    const j = await r.json();
    if (r.ok && j.ok) return location.replace("/");
    err.textContent = j.error || "No se pudo entrar";
  } catch (x) { err.textContent = "No se pudo hablar con el NAS"; }
  go.disabled = false;
};
</script>
</body>
</html>
